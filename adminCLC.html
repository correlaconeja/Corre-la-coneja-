<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrador CLC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
      font-family: Georgia, serif;
      background: #f3eee6;
      color: #30251b;
    }

    .contenedor {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 40px;
      font-weight: normal;
      color: #6f4d25;
    }

    .subtitulo {
      text-align: center;
      margin-bottom: 30px;
    }

    .botones {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    button {
      padding: 14px 25px;
      border: none;
      border-radius: 30px;
      background: #9a7543;
      color: white;
      font-family: Georgia, serif;
      font-size: 16px;
      cursor: pointer;
    }

    button.btn-exportar {
      background: #4a7c59;
    }

    .caja {
      background: white;
      border: 1px solid #d8c4a4;
      border-radius: 18px;
      padding: 25px;
      margin-top: 25px;
    }

    .item {
      padding: 12px;
      border-bottom: 1px solid #eadcc5;
      cursor: pointer;
    }

    .item:hover {
      background: #f5ecdd;
    }

    #editor {
      display: none;
    }

    .campo {
      margin-top: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #cdb995;
      font-family: Georgia, serif;
      font-size: 16px;
      background: white;
    }

    textarea {
      height: 140px;
    }

    .aviso {
      text-align: center;
      margin-top: 15px;
      color: #6f4d25;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <h1>✨ Administrador CLC ✨</h1>

    <div class="subtitulo">Panel privado Corre la Coneja</div>

    <div class="botones">
      <button onclick="mostrarBiblioteca('cristales')">💎 Cristales</button>
      <button onclick="mostrarBiblioteca('figuras')">🦋 Figuras</button>
      <button onclick="mostrarBiblioteca('flores')">🌸 Flores</button>
      <button onclick="mostrarBiblioteca('pirita')">✨ Pirita</button>
      <button onclick="mostrarBiblioteca('componentes')">✨ Componentes</button>
      <button class="btn-exportar" onclick="exportarArchivosJS()">📦 Ver Código para Copiar</button>
    </div>

    <div class="caja">
      <h2 id="titulo">Elegí una biblioteca</h2>
      <div id="lista"></div>
      <br>
      <button id="btnNuevo" onclick="nuevoElementoCLC()">➕ Nuevo elemento CLC</button>
    </div>

    <div class="caja" id="editor">
      <h2>Editar / Crear elemento</h2>

      <div class="campo">
        <label>Categoría</label>
        <select id="categoriaNueva" onchange="cambiarCategoriaCLC()">
          <option value="cristal">💎 Cristal</option>
          <option value="figura">🦋 Figura</option>
          <option value="flor">🌸 Flor</option>
        </select>
      </div>

      <div class="campo">
        <label>Nombre</label>
        <input id="nombre">
      </div>

      <div class="campo">
        <label>Código</label>
        <input id="codigo" readonly>
      </div>

      <div class="campo">
        <label>Código secundario</label>
        <input id="codigoSecundario" readonly>
      </div>

      <div class="campo">
        <label>Símbolo</label>
        <input id="simbolo">
      </div>

      <div class="campo">
        <label>Frase del componente</label>
        <input id="fraseComponente">
      </div>

      <div class="campo">
        <label>Descripción del componente</label>
        <textarea id="descripcionComponente"></textarea>
      </div>

      <div class="campo">
        <label>Mensaje principal (Oráculo)</label>
        <textarea id="principal"></textarea>
      </div>

      <div class="campo">
        <label>Mensaje secundario (Oráculo)</label>
        <textarea id="secundaria"></textarea>
      </div>

      <br>
      <button onclick="guardarCambios()">💾 Guardar cambios</button>

      <div id="aviso" class="aviso"></div>
    </div>

    <!-- Caja para copiar el código generado -->
    <div id="cajaExportacion" class="caja" style="display: none; background: #fdfaf6; border: 2px solid #4a7c59;">
      <h3 style="margin-top:0; color: #4a7c59;">📦 Código Generado</h3>
      <p style="font-size: 14px; color: #555;">Toca el botón verde de abajo para copiar todo este texto y luego pegalo en tu archivo:</p>
      <textarea id="textoCodigo" style="height: 200px; font-family: monospace; font-size: 13px;"></textarea>
      <br><br>
      <button onclick="copiarCodigoExportado()" style="background: #4a7c59;">📋 Copiar Código</button>
    </div>

  </div>
  <!-- Bibliotecas externas -->
  <script src="./bclccris.js"></script>
  <script src="./bclcfiguras.js"></script>
  <script src="./bclcflores.js"></script>
  <script src="./bclcpirita.js"></script>
  <script src="./componentesCLC.js"></script>
  <script src="./componentesagregados.js"></script>
  <script src="./bclcagregados.js"></script>

  <!-- Lógica del Administrador (Con la clave corregida por nombreVal) -->
  <script>
    window.agregadosCLC = window.agregadosCLC || {};
    window.componentesAgregadosCLC = window.componentesAgregadosCLC || {
      cristales: {},
      figuras: {},
      flores: {}
    };

    let bibliotecaActual = null;
    let elementoActual = null;
    let categoriaComponentes = null;

    function obtenerBiblioteca(tipo) {
      if (tipo === "cristales") return window.cristalesCLC;
      if (tipo === "figuras") return window.figurasCLC;
      if (tipo === "flores") return window.floresCLC;
      if (tipo === "pirita") return window.combinacionesPirita;
      if (tipo === "componentes") return window.componentesCLC;
      return null;
    }

    function mostrarBiblioteca(tipo) {
      bibliotecaActual = tipo;
      let datos = obtenerBiblioteca(tipo);
      let lista = document.getElementById("lista");
      let titulo = document.getElementById("titulo");

      lista.innerHTML = "";
      document.getElementById("editor").style.display = "none";

      if (tipo === "componentes") {
        categoriaComponentes = null;
        titulo.innerHTML = "COMPONENTES";

        let categorias = ["cristales", "figuras", "flores"];
        categorias.forEach(function (cat) {
          let div = document.createElement("div");
          div.className = "item";
          div.innerHTML = "📂 " + cat.toUpperCase();
          div.onclick = function () {
            mostrarCategoriaComponentes(cat);
          };
          lista.appendChild(div);
        });
        return;
      }

      if (!datos) {
        titulo.innerHTML = "Biblioteca no encontrada";
        return;
      }

      titulo.innerHTML = tipo.toUpperCase();

      Object.keys(datos).forEach(function (nombre) {
        let div = document.createElement("div");
        div.className = "item";
        div.innerHTML = nombre;
        div.onclick = function () {
          abrirElemento(nombre);
        };
        lista.appendChild(div);
      });
    }

    function mostrarCategoriaComponentes(categoria) {
      categoriaComponentes = categoria;

      let baseCat = (window.componentesCLC && window.componentesCLC[categoria]) || {};
      let agregadosCat = (window.componentesAgregadosCLC && window.componentesAgregadosCLC[categoria]) || {};

      let datos = Object.assign({}, baseCat, agregadosCat);

      let lista = document.getElementById("lista");
      let titulo = document.getElementById("titulo");

      lista.innerHTML = "";
      titulo.innerHTML = "COMPONENTES: " + categoria.toUpperCase();

      Object.keys(datos).forEach(function (codigo) {
        let div = document.createElement("div");
        div.className = "item";
        let esAgregado = window.componentesAgregadosCLC[categoria]?.[codigo] ? " ✨" : "";
        div.innerHTML = (datos[codigo].nombre || codigo) + esAgregado;
        div.onclick = function () {
          abrirComponente(codigo);
        };
        lista.appendChild(div);
      });
    }

    function abrirElemento(nombre) {
      let datos = obtenerBiblioteca(bibliotecaActual)[nombre];
      if (!datos) return;

      elementoActual = nombre;
      document.getElementById("editor").style.display = "block";

      document.getElementById("nombre").value = datos.nombre || nombre;
      document.getElementById("codigo").value = datos.codigo || "";
      document.getElementById("codigoSecundario").value = datos.codigoSecundario || "";
      document.getElementById("simbolo").value = datos.simbolo || "";
      document.getElementById("fraseComponente").value = datos.frase || "";
      document.getElementById("descripcionComponente").value = datos.descripcion || "";
      document.getElementById("principal").value = datos.principal || datos.mensaje || "";
      document.getElementById("secundaria").value = datos.secundaria || "";
      document.getElementById("aviso").innerHTML = "";
    }

    function abrirComponente(codigo) {
      let baseComp = window.componentesCLC[categoriaComponentes]?.[codigo];
      let agregadoComp = window.componentesAgregadosCLC[categoriaComponentes]?.[codigo];
      let datos = Object.assign({}, baseComp, agregadoComp);

      elementoActual = codigo;
      document.getElementById("editor").style.display = "block";

      document.getElementById("nombre").value = datos.nombre || "";
      document.getElementById("codigo").value = Array.isArray(datos.codigo) ? datos.codigo[0] : (datos.codigo || codigo);
      document.getElementById("codigoSecundario").value = Array.isArray(datos.codigo) ? (datos.codigo[1] || "") : "";
      document.getElementById("simbolo").value = datos.simbolo || "";
      document.getElementById("fraseComponente").value = datos.frase || "";
      document.getElementById("descripcionComponente").value = datos.descripcion || "";
      document.getElementById("principal").value = datos.principal || "";
      document.getElementById("secundaria").value = datos.secundaria || "";
      document.getElementById("aviso").innerHTML = "";
    }

    function nuevoElementoCLC() {
      document.getElementById("editor").style.display = "block";
      document.getElementById("nombre").value = "";
      document.getElementById("codigo").value = "";
      document.getElementById("codigoSecundario").value = "";
      document.getElementById("simbolo").value = "";
      document.getElementById("fraseComponente").value = "";
      document.getElementById("descripcionComponente").value = "";
      document.getElementById("principal").value = "";
      document.getElementById("secundaria").value = "";

      document.getElementById("titulo").innerHTML = "NUEVO ELEMENTO CLC";
      elementoActual = null;
      document.getElementById("categoriaNueva").value = "cristal";

      cambiarCategoriaCLC();
      generarCodigoCLC();
      document.getElementById("aviso").innerHTML = "";
    }

    function cambiarCategoriaCLC() {
      let catSelect = document.getElementById("categoriaNueva").value;
      let campoSecundario = document.getElementById("codigoSecundario").parentElement;

      if (catSelect === "cristal") {
        campoSecundario.style.display = "block";
      } else {
        campoSecundario.style.display = "none";
      }
      generarCodigoCLC();
    }

    function generarCodigoCLC() {
      let numerosUsados = [];
      let letrasUsadas = [];

      function revisarBiblioteca(biblioteca) {
        if (!biblioteca) return;

        let procesarItem = function (item) {
          if (!item) return;
          if (item.codigoSecundario) {
            numerosUsados.push(String(item.codigoSecundario).padStart(2, "0"));
          }
          if (Array.isArray(item.codigo)) {
            let posibleNumero = item.codigo.find(x => /^\d+$/.test(x));
            if (posibleNumero) {
              numerosUsados.push(String(posibleNumero).padStart(2, "0"));
            }
            if (item.codigo[0] && /^[A-Z]{2}$/.test(item.codigo[0])) {
              letrasUsadas.push(item.codigo[0]);
            }
          } else if (typeof item.codigo === "string" && /^[A-Z]{2}$/.test(item.codigo)) {
            letrasUsadas.push(item.codigo);
          }
        };

        if (Array.isArray(biblioteca)) {
          biblioteca.forEach(procesarItem);
        } else {
          Object.values(biblioteca).forEach(function (cat) {
            if (cat && typeof cat === "object") {
              if (cat.nombre || cat.codigo) {
                procesarItem(cat);
              } else {
                Object.values(cat).forEach(procesarItem);
              }
            }
          });
        }
      }

      revisarBiblioteca(window.cristalesCLC);
      revisarBiblioteca(window.figurasCLC);
      revisarBiblioteca(window.floresCLC);
      revisarBiblioteca(window.combinacionesPirita);
      revisarBiblioteca(window.componentesCLC);
      revisarBiblioteca(window.componentesAgregadosCLC);

      let numero = 1;
      while (numerosUsados.includes(String(numero).padStart(2, "0"))) {
        numero++;
      }
      document.getElementById("codigoSecundario").value = String(numero).padStart(2, "0");

      let codigoNuevo = "";
      for (let i = 0; i < 26; i++) {
        for (let j = 0; j < 26; j++) {
          let posible = String.fromCharCode(65 + i) + String.fromCharCode(65 + j);
          if (!letrasUsadas.includes(posible)) {
            codigoNuevo = posible;
            break;
          }
        }
        if (codigoNuevo) break;
      }
      document.getElementById("codigo").value = codigoNuevo;
    }

    function guardarCambios() {
      let catSelect = document.getElementById("categoriaNueva").value;
      let categoriasMapa = {
        cristal: "cristales",
        figura: "figuras",
        flor: "flores"
      };

      let nombreVal = document.getElementById("nombre").value.trim();
      let codigoVal = document.getElementById("codigo").value.trim();
      let codigoSecVal = document.getElementById("codigoSecundario").value.trim();
      let simboloVal = document.getElementById("simbolo").value.trim();
      let fraseVal = document.getElementById("fraseComponente").value.trim();
      let descVal = document.getElementById("descripcionComponente").value.trim();
      let princVal = document.getElementById("principal").value.trim();
      let secVal = document.getElementById("secundaria").value.trim();

      if (!nombreVal) {
        alert("Por favor, ingresá un nombre.");
        return;
      }

      let catFinal = categoriaComponentes || bibliotecaActual || categoriasMapa[catSelect] || "cristales";
      if (!["cristales", "figuras", "flores"].includes(catFinal)) {
        catFinal = "cristales";
      }

      if (!elementoActual) {
        if (!window.componentesAgregadosCLC[catFinal]) window.componentesAgregadosCLC[catFinal] = {};
        window.componentesAgregadosCLC[catFinal][codigoVal] = {
          nombre: nombreVal,
          codigo: [codigoVal, codigoSecVal],
          frase: fraseVal,
          descripcion: descVal
        };

        if (!window.agregadosCLC[catFinal]) window.agregadosCLC[catFinal] = {};
        // CORRECCIÓN: Se usa nombreVal como clave para que crear.html lo lea correctamente
        window.agregadosCLC[catFinal][nombreVal] = {
          tipo: catFinal,
          nombre: nombreVal,
          codigo: codigoVal,
          codigoSecundario: codigoSecVal,
          simbolo: simboloVal,
          principal: princVal,
          secundaria: secVal
        };

        document.getElementById("aviso").innerHTML = "✨ Nuevo elemento creado. Tocá el botón verde arriba para ver el código.";
        elementoActual = nombreVal;
        return;
      }

      let datosOriginales = obtenerBiblioteca(bibliotecaActual)?.[elementoActual];
      let claveNombreViejo = elementoActual;

      if (!window.agregadosCLC[catFinal]) window.agregadosCLC[catFinal] = {};
      
      if (claveNombreViejo && claveNombreViejo !== nombreVal && window.agregadosCLC[catFinal][claveNombreViejo]) {
        delete window.agregadosCLC[catFinal][claveNombreViejo];
      }

      window.agregadosCLC[catFinal][nombreVal] = {
        tipo: catFinal,
        nombre: nombreVal,
        codigo: codigoVal,
        codigoSecundario: codigoSecVal,
        simbolo: simboloVal,
        principal: princVal,
        secundaria: secVal
      };

      document.getElementById("aviso").innerHTML = "✨ Guardado. Tocá el botón verde de arriba para copiar el código.";
    }

    function exportarArchivosJS() {
      let caja = document.getElementById("cajaExportacion");
      let texto = document.getElementById("textoCodigo");

      let compText = "// Copiá esto dentro de componentesagregados.js:\nwindow.componentesAgregadosCLC = " + JSON.stringify(window.componentesAgregadosCLC, null, 2) + ";\n\n";
      let agregText = "// Copiá esto dentro de bclcagregados.js:\nwindow.bclcAgregados = window.agregadosCLC = " + JSON.stringify(window.agregadosCLC, null, 2) + ";";

      texto.value = compText + agregText;
      caja.style.display = "block";
      caja.scrollIntoView({ behavior: 'smooth' });
    }

    function copiarCodigoExportado() {
      let texto = document.getElementById("textoCodigo");
      texto.select();
      texto.setSelectionRange(0, 99999);

      navigator.clipboard.writeText(texto.value).then(function() {
        alert("¡Código copiado con éxito!");
      }).catch(function() {
        alert("Seleccioná el texto del cuadro manualmente y poné Copiar.");
      });
    }
  </script>

</body>

</html>
