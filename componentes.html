<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Componentes del Atrapasol | Corre la Coneja</title>

  <script src="componentesagregados.js"></script>
  <script src="bclcagregados.js"></script>
  <script src="bclccris.js"></script>
  <script src="bclcfiguras.js"></script>
  <script src="bclcflores.js"></script>
  <script src="bclcpirita.js"></script>
  <script src="componentesCLC.js"></script>
  <script src="diccionarioCLC.js?v=2"></script>
  <script src="codificadorCLC.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 15px 50px;
      font-family: 'Montserrat', sans-serif;
      color: #2b2017;
      background-image: url("./reflejos-atrapasol.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .contenedor {
      width: 100%;
      max-width: 800px;
      margin: auto;
    }

    .headerMarca { text-align: center; margin-bottom: 25px; }
    .medallaLogo {
      width: 120px;
      height: 120px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: rgba(255, 252, 246, 0.92);
      border: 1px solid rgba(195, 165, 120, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(60, 40, 20, 0.12);
    }
    .logoImagen { width: 130%; height: 130%; object-fit: contain; mix-blend-mode: multiply; }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 36px;
      margin: 0 0 5px;
      color: #24180e;
      text-align: center;
    }
    .subtitulo {
      text-align: center;
      font-size: 14px;
      color: #5d4632;
      font-style: italic;
      margin-bottom: 30px;
    }

    .listaComponentes {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .desplegableComponente {
      background: rgba(255, 253, 248, 0.95);
      border: 1px solid rgba(210, 185, 145, 0.85);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(60, 40, 20, 0.06);
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }

    .desplegableComponente[open] {
      box-shadow: 0 12px 30px rgba(60, 40, 20, 0.12);
    }

    .desplegableComponente summary {
      padding: 18px 22px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 600;
      color: #382618;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      background: rgba(255, 255, 255, 0.5);
      transition: background 0.2s;
      list-style: none;
    }

    .desplegableComponente summary::-webkit-details-marker {
      display: none;
    }

    .desplegableComponente summary:hover {
      background: rgba(255, 255, 255, 0.9);
    }

    .flechaDesplegable {
      font-size: 14px;
      color: #8c6239;
      transition: transform 0.3s ease;
      display: inline-block;
      margin-left: 10px;
    }

    .desplegableComponente[open] .flechaDesplegable {
      transform: rotate(180deg);
    }

    .contenidoDesplegable {
      padding: 20px 22px;
      border-top: 1px solid rgba(210, 185, 145, 0.4);
      display: flex;
      gap: 20px;
      align-items: center;
      background: rgba(255, 255, 255, 0.3);
    }

    .imagenComponente {
      width: 100px;
      height: 100px;
      object-fit: contain;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.8);
      padding: 5px;
      flex-shrink: 0;
      border: 1px solid rgba(210, 185, 145, 0.5);
    }

    .bloqueTexto {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .fraseDestacada {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-style: italic;
      font-weight: 600;
      color: #8c6239;
      line-height: 1.4;
    }

    .textoDetalle {
      font-size: 14px;
      color: #5a4533;
      line-height: 1.6;
    }

    .botonVolver {
      display: block;
      width: fit-content;
      margin: 30px auto 0;
      padding: 12px 30px;
      border-radius: 25px;
      background: #8c6239;
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: .25s;
      box-shadow: 0 5px 15px rgba(140, 98, 57, 0.2);
    }
    .botonVolver:hover { background: #734e2c; transform: translateY(-2px); }

    @media (max-width: 600px) {
      .contenidoDesplegable {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="contenedor">

    <div class="headerMarca">
      <div class="medallaLogo">
        <img src="./logo.jpeg" alt="Corre la Coneja" class="logoImagen" onerror="this.src='./logo.jpg'; this.onerror=function(){ this.src='./logo.png'; }">
      </div>
      <h1 id="tituloAtrapasol">Componentes de tu Atrapasol</h1>
      <div class="subtitulo" id="subtituloAtrapasol">Conocé cada elemento que llena de luz tu espacio</div>
    </div>

    <div id="contenedorLista" class="listaComponentes"></div>

    <a href="./index.html" class="botonVolver">← Volver al Oráculo</a>

  </div>

  <script>
    function buscarFichaComponente(token) {
      let secciones = ['cristales', 'figuras', 'flores'];

      // 1. Buscar en componentesAgregadosCLC (Agregados vía Admin)
      if (window.componentesAgregadosCLC) {
        for (let sec of secciones) {
          let catAgregados = window.componentesAgregadosCLC[sec] || {};
          for (let key of Object.keys(catAgregados)) {
            let item = catAgregados[key];
            let c1 = Array.isArray(item.codigo) ? item.codigo[0] : item.codigo;
            let c2 = Array.isArray(item.codigo) ? item.codigo[1] : item.codigoSecundario;
            if (c1 === token || c2 === token || key === token) {
              return { ...item, categoria: sec };
            }
          }
        }
      }

      // 2. Buscar en componentesCLC (Base)
      if (window.componentesCLC) {
        for (let sec of secciones) {
          let catBase = window.componentesCLC[sec] || {};
          for (let key of Object.keys(catBase)) {
            let item = catBase[key];
            let c1 = Array.isArray(item.codigo) ? item.codigo[0] : item.codigo;
            let c2 = Array.isArray(item.codigo) ? item.codigo[1] : item.codigoSecundario;
            if (c1 === token || c2 === token || key === token) {
              return { ...item, categoria: sec };
            }
          }
        }
      }

      // 3. Buscar en bibliotecas de mensajes
      let basesMensajes = [
        window.bclcAgregados?.cristales, window.bclcAgregados?.figuras, window.bclcAgregados?.flores,
        window.cristalesCLC, window.figurasCLC, window.floresCLC
      ];

      for (let base of basesMensajes) {
        if (!base) continue;
        for (let key of Object.keys(base)) {
          let item = base[key];
          if (item.codigo === token || item.codigoSecundario === token) {
            return {
              nombre: item.nombre || key,
              frase: item.frase || "",
              descripcion: item.descripcion || item.principal || "",
              categoria: item.tipo || "componente"
            };
          }
        }
      }

      return null;
    }

    window.addEventListener("DOMContentLoaded", function() {
      let params = new URLSearchParams(window.location.search);
      let codigoIngresado = params.get("codigo");

      let contenedorLista = document.getElementById("contenedorLista");
      let titulo = document.getElementById("tituloAtrapasol");

      if (!codigoIngresado) {
        contenedorLista.innerHTML = "<p style='text-align:center; width:100%;'>No se ingresó ningún código de Atrapasol.</p>";
        return;
      }

      titulo.innerHTML = "Componentes: " + codigoIngresado.toUpperCase();

      let codigoLargo = CodificadorCLC.expandir(codigoIngresado);
      if (!codigoLargo) {
        contenedorLista.innerHTML = "<p style='text-align:center; width:100%;'>Código de Atrapasol no encontrado.</p>";
        return;
      }

      let tokens = [];
      for (let i = 0; i < codigoLargo.length; i += 2) {
        tokens.push(codigoLargo.substring(i, i + 2));
      }

      let desplegablesHTML = "";
      let procesados = new Set();

      tokens.forEach(token => {
        if (token.length < 2 || procesados.has(token)) return;

        let item = buscarFichaComponente(token);
        if (item) {
          procesados.add(token);
          let imgSrc = item.imagen || `./${item.nombre ? item.nombre.toLowerCase().replace(/\s+/g, '') : token}.jpg`;

          let fraseHTML = item.frase ? `<div class="fraseDestacada">"${item.frase}"</div>` : '';
          let descripcionHTML = item.descripcion ? `<div class="textoDetalle">${item.descripcion}</div>` : '';

          desplegablesHTML += `
            <details class="desplegableComponente">
              <summary>
                <span>${item.nombre || token}</span>
                <span class="flechaDesplegable">▼</span>
              </summary>
              <div class="contenidoDesplegable">
                <img src="${imgSrc}" class="imagenComponente" alt="${item.nombre || token}" onerror="this.style.display='none'">
                <div class="bloqueTexto">
                  ${fraseHTML}
                  ${descripcionHTML}
                </div>
              </div>
            </details>
          `;
        }
      });

      if (desplegablesHTML) {
        contenedorLista.innerHTML = desplegablesHTML;
      } else {
        contenedorLista.innerHTML = "<p style='text-align:center; width:100%;'>No se encontraron fichas individuales para los componentes de esta pieza.</p>";
      }
    });
  </script>
</body>
</html>
