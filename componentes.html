<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Componentes | Corre la Coneja</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px 15px 50px;
      font-family: 'Montserrat', sans-serif;
      color: #2b2017;
      background-image: url("./reflejos-atrapasol.png");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      position: relative;
    }

    .contenedor {
      width: 100%;
      max-width: 700px;
      margin: auto;
      position: relative;
      z-index: 1;
    }

    .headerMarca { text-align: center; margin-bottom: 30px; }

    .medallaLogo {
      width: 130px;
      height: 130px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: rgba(255, 252, 246, 0.92);
      border: 1px solid rgba(195, 165, 120, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(60, 40, 20, 0.12), 0 0 0 4px rgba(255, 255, 255, 0.5);
    }

    .logoImagen {
      width: 130%;
      height: 130%;
      object-fit: contain;
      border-radius: 50%;
      mix-blend-mode: multiply;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      text-align: center;
      font-size: 38px;
      font-weight: 400;
      letter-spacing: 2px;
      margin: 0 0 6px;
      color: #24180e;
      text-shadow: 0 2px 10px rgba(255,255,255,0.8);
    }

    .subtitulo {
      text-align: center;
      font-size: 14px;
      color: #4a3728;
      margin-bottom: 30px;
      font-style: italic;
      text-shadow: 0 1px 5px rgba(255,255,255,0.8);
    }

    details {
      background: rgba(255, 253, 248, 0.94);
      border: 1px solid rgba(210, 185, 145, 0.85);
      border-radius: 18px;
      margin-bottom: 15px;
      padding: 16px 20px;
      box-shadow: 0 8px 20px rgba(60, 40, 20, 0.08);
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }

    details[open] {
      background: rgba(255, 255, 255, 0.97);
      border-color: #8c6239;
      box-shadow: 0 12px 28px rgba(60, 40, 20, 0.14);
    }

    summary {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 600;
      color: #2b1d11;
      cursor: pointer;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      outline: none;
    }

    summary::-webkit-details-marker { display: none; }

    summary::after {
      content: '✦';
      font-size: 14px;
      color: #8c6239;
      transition: transform 0.3s ease;
    }

    details[open] summary::after { transform: rotate(45deg); }

    .contenidoTarjeta {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(180, 150, 110, 0.25);
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    @media (min-width: 500px) {
      .contenidoTarjeta {
        flex-direction: row;
        align-items: flex-start;
      }
    }

    .imagenComponente {
      width: 110px;
      height: 110px;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid rgba(180, 150, 110, 0.4);
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      flex-shrink: 0;
    }

    .infoComponente { flex-grow: 1; }

    .fraseDestacada {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-style: italic;
      color: #734e2c;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .descripcionTexto {
      font-size: 14px;
      line-height: 1.6;
      color: #382618;
      margin: 0;
    }

    .botonVolver {
      display: block;
      width: fit-content;
      margin: 35px auto 0;
      padding: 12px 30px;
      border-radius: 25px;
      background: rgba(255, 253, 248, 0.9);
      border: 1px solid rgba(190, 160, 115, 0.6);
      color: #5a3e23;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 4px 12px rgba(80, 55, 25, 0.08);
      transition: 0.25s;
    }

    .botonVolver:hover {
      background: #8c6239;
      color: white;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <div class="headerMarca">
      <div class="medallaLogo">
        <img src="./logo.jpeg" alt="Corre la Coneja" class="logoImagen" onerror="this.src='./logo.jpg'; this.onerror=function(){ this.src='./logo.png'; this.onerror=function(){ this.parentElement.style.display='none'; } }">
      </div>
      <h1>Componentes de tu Atrapasol</h1>
      <div class="subtitulo">Conocé cada cristal, figura y flor que componen tu pieza.</div>
    </div>

    <div id="contenedorTarjetas"></div>

    <a id="btnVolverMensaje" href="./index.html" class="botonVolver">← Volver al mensaje del Atrapasol</a>
  </div>
  <script src="diccionarioCLC.js"></script>
  <script src="codificadorCLC.js"></script>
  <script src="componentesCLC.js"></script>
  <script src="componentesagregados.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const urlParams = new URLSearchParams(window.location.search);
      let codigoBuscado = (urlParams.get("codigo") || "").trim().toUpperCase();

      const btnVolver = document.getElementById("btnVolverMensaje");
      if (btnVolver && codigoBuscado) {
        btnVolver.href = `./index.html?codigo=${encodeURIComponent(codigoBuscado)}`;
      }

      // Red de seguridad: Traducimos por diccionario o expandimos si es código corto
      if (window.diccionarioCLC && window.diccionarioCLC[codigoBuscado]) {
        codigoBuscado = window.diccionarioCLC[codigoBuscado];
      } else if (codigoBuscado.length === 5 && window.CodificadorCLC) {
        codigoBuscado = window.CodificadorCLC.expandir(codigoBuscado) || codigoBuscado;
      }

      // Cortar el código en tokens de a 2 caracteres
      const tokens = [];
      for (let i = 0; i < codigoBuscado.length; i += 2) {
        const token = codigoBuscado.substr(i, 2);
        if (token.length === 2) {
          tokens.push(token);
        }
      }

      // Unificar bibliotecas base y agregados
      const compBase = window.componentesCLC || {};
      const compAgregados = window.componentesAgregadosCLC || {};

      const fuentes = {
        cristales: Object.assign({}, compBase.cristales || {}, compAgregados.cristales || {}),
        figuras: Object.assign({}, compBase.figuras || {}, compAgregados.figuras || {}),
        flores: Object.assign({}, compBase.flores || {}, compAgregados.flores || {})
      };

      const procesados = new Set();
      const tarjetasCristales = [];
      const tarjetasFiguras = [];
      const tarjetasFlores = [];

      // Evaluar cada token
      tokens.forEach(token => {
        // A. Buscar en Cristales
        for (const key in fuentes.cristales) {
          const item = fuentes.cristales[key];
          const codigos = Array.isArray(item.codigo) ? item.codigo : [item.codigo];
          if (codigos.includes(token)) {
            if (!procesados.has(item.nombre)) {
              procesados.add(item.nombre);
              tarjetasCristales.push(item);
            }
            return;
          }
        }

        // B. Buscar en Figuras
        for (const key in fuentes.figuras) {
          const item = fuentes.figuras[key];
          const codigos = Array.isArray(item.codigo) ? item.codigo : [item.codigo];
          if (codigos.includes(token)) {
            if (!procesados.has(item.nombre)) {
              procesados.add(item.nombre);
              tarjetasFiguras.push(item);
            }
            return;
          }
        }

        // C. Buscar en Flores
        for (const key in fuentes.flores) {
          const item = fuentes.flores[key];
          const codigos = Array.isArray(item.codigo) ? item.codigo : [item.codigo];
          if (codigos.includes(token)) {
            if (!procesados.has(item.nombre)) {
              procesados.add(item.nombre);
              tarjetasFlores.push(item);
            }
            return;
          }
        }
      });

      // Orden respetado: Cristales -> Figuras -> Flores
      const listaFinal = [...tarjetasCristales, ...tarjetasFiguras, ...tarjetasFlores];

      const contenedor = document.getElementById("contenedorTarjetas");
      contenedor.innerHTML = "";

      if (listaFinal.length === 0) {
        contenedor.innerHTML = `<div style="text-align:center; padding: 40px; font-style: italic;">No se encontraron componentes para el código ingresado.</div>`;
        return;
      }

      listaFinal.forEach(item => {
        const details = document.createElement("details");
        const rutaImagen = item.imagen ? item.imagen : `./componentes/${item.nombre.toLowerCase().replace(/\s+/g, '-')}.jpg`;

        details.innerHTML = `
          <summary>${item.nombre}</summary>
          <div class="contenidoTarjeta">
            <img src="${rutaImagen}" alt="${item.nombre}" class="imagenComponente" onerror="this.style.display='none'">
            <div class="infoComponente">
              ${item.frase ? `<div class="fraseDestacada">${item.frase}</div>` : ''}
              <p class="descripcionTexto">${item.descripcion || ''}</p>
            </div>
          </div>
        `;
        contenedor.appendChild(details);
      });
    });
  </script>
</body>
</html>
